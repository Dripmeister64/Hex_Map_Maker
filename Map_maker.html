<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Lancer Hex Map Maker</title>
<style>
:root{
  --bg:#0d1015; --panel:#151a21; --panel2:#1c232d; --line:#2a3340; --text:#d8dfe8;
  --muted:#8693a3; --accent:#ff6b3d; --accent2:#4fd1ff;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:"Segoe UI",system-ui,sans-serif;font-size:14px;overflow:hidden}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:.06em}
.muted{color:var(--muted);font-size:12px}
kbd{font-family:Consolas,monospace;font-size:11px;color:var(--muted);border:1px solid var(--line);
  border-radius:3px;padding:0 4px;margin-left:auto}
input[type=text],input[type=number],input:not([type]){background:#0f1319;color:var(--text);
  border:1px solid var(--line);border-radius:5px;padding:7px 9px;font:inherit;width:100%}
input:focus{outline:none;border-color:var(--accent2)}
input[type=range]{width:100%;accent-color:var(--accent2)}
input[type=checkbox]{accent-color:var(--accent2)}
.btn{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:6px;
  padding:7px 12px;cursor:pointer;font:inherit;white-space:nowrap}
.btn:hover{border-color:#41506a;background:#232c39}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#170d08;font-weight:600}
.btn.primary:hover{background:#ff8458}
.btn.danger:hover{border-color:#c0392b;background:#3a1a17}
.btn.small{padding:4px 9px;font-size:12px}

/* ---------- MENU ---------- */
#menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 30% 20%,#1b2633 0%,#0d1015 60%);overflow:auto;padding:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:28px 30px;width:480px;
  box-shadow:0 20px 60px rgba(0,0,0,.5);position:relative}
.card::before{content:"";position:absolute;left:0;top:0;right:0;height:3px;border-radius:12px 12px 0 0;
  background:linear-gradient(90deg,var(--accent),var(--accent2))}
.brand{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.logo{font-size:38px;color:var(--accent);line-height:1}
.brand h1{font-size:22px}
.brand .sub{color:var(--muted);font-size:12px;letter-spacing:.15em;text-transform:uppercase}
.card h2{font-size:12px;color:var(--accent2);text-transform:uppercase;letter-spacing:.18em;margin:18px 0 10px}
.field{display:block;margin-bottom:12px}
.field>span{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.row{display:flex;gap:12px}.row>*{flex:1}
.presets{display:flex;gap:6px;align-items:center;margin:-2px 0 12px;flex-wrap:wrap}
.continue{display:flex;align-items:center;gap:12px;justify-content:space-between;background:#1a2430;
  border:1px solid #2c4256;border-radius:8px;padding:12px 14px}
.bgpick{display:flex;gap:10px;align-items:center}
#bgName{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
#bgPreview{display:block;max-width:100%;max-height:150px;margin:10px auto 0;border:1px solid var(--line);border-radius:6px}
.actions{display:flex;justify-content:space-between;gap:10px;margin-top:22px}

/* ---------- EDITOR ---------- */
#editor{position:fixed;inset:0;display:none;grid-template-columns:250px 1fr;grid-template-rows:50px 1fr 28px;
  grid-template-areas:"top top" "side stage" "status status"}
#topbar{grid-area:top;display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--panel);
  border-bottom:1px solid var(--line)}
#topbar .logo{font-size:26px}
#eName{width:240px;background:transparent;border-color:transparent;font-weight:600;font-size:15px}
#eName:hover{border-color:var(--line)}
.grow{flex:1}
.sep{width:1px;height:24px;background:var(--line);margin:0 4px}
#sidebar{grid-area:side;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;overflow-x:hidden;padding:6px 12px 20px}
#sidebar section{padding:12px 0;border-bottom:1px solid var(--line)}
#sidebar section:last-child{border-bottom:none}
#sidebar h3{font-size:11px;color:var(--accent2);text-transform:uppercase;letter-spacing:.18em;margin-bottom:10px}
#sidebar label{display:block;font-size:12px;color:var(--muted);margin:8px 0 4px}
#sidebar label.chk{display:flex;align-items:center;gap:7px;color:var(--text);font-size:13px}
.tools{display:grid;gap:5px}
.tool{display:flex;align-items:center;gap:9px;text-align:left}
.tool.active,.tpl.active,.seg button.active{border-color:var(--accent2);background:#18293a;box-shadow:inset 0 0 0 1px var(--accent2)}
.sw{width:16px;height:16px;border-radius:3px;border:1px solid rgba(255,255,255,.25);flex:none;
  clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.sw.zone{background:repeating-linear-gradient(45deg,rgba(var(--zc),.9) 0 3px,rgba(var(--zc),.3) 3px 6px)}
.sw.diff{background:repeating-linear-gradient(45deg,rgba(214,160,90,.85) 0 2px,transparent 2px 5px),repeating-linear-gradient(-45deg,rgba(214,160,90,.85) 0 2px,rgba(214,160,90,.2) 2px 5px)}
.sw.danger{background:rgba(236,84,60,.55);border-color:rgba(236,84,60,.95)}
.climbic{width:16px;text-align:center;color:#aab4c0;font-weight:700}
.sw.erase{background:repeating-linear-gradient(45deg,#ff6b3d 0 3px,transparent 3px 6px)}
.seg{display:flex;gap:4px;margin-top:8px;align-items:center}
.seg span{font-size:12px;color:var(--muted);margin-right:4px}
.seg button{flex:1}
.tplcat{font-size:11px;color:var(--muted);margin:10px 0 5px;text-transform:uppercase;letter-spacing:.1em}
.tplgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
.tpl{display:flex;flex-direction:column;align-items:center;padding:4px 2px 5px;gap:2px;font-size:10.5px;line-height:1.15;text-align:center}
.tpl canvas{width:100%;max-width:62px;height:auto}
.tpl{min-width:0;overflow:hidden;white-space:normal}
.rotrow{display:flex;align-items:center;gap:6px;margin-top:10px}
#rotLabel{min-width:48px;text-align:center;font-family:Consolas,monospace}
.btnrow{display:flex;gap:6px;margin-top:8px}.btnrow>*{flex:1}
#stage{grid-area:stage;position:relative;overflow:hidden;
  background:#0a0d11 repeating-linear-gradient(0deg,transparent 0 39px,#10151b 39px 40px),
             repeating-linear-gradient(90deg,transparent 0 39px,#10151b 39px 40px)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair;touch-action:none}
#status{grid-area:status;display:flex;align-items:center;gap:18px;padding:0 12px;background:var(--panel);
  border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
#stSave.ok{color:#6fd18a}#stSave.bad{color:#ff6b6b}
#toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:#1e2a36;border:1px solid #33506a;
  padding:8px 16px;border-radius:6px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.show{opacity:1}
</style>
</head>
<body>

<!-- ====================== MAIN MENU ====================== -->
<div id="menu">
  <div class="card">
    <div class="brand">
      <span class="logo">⬡</span>
      <div><h1>HEX MAP MAKER</h1><div class="sub">Battlemap builder for Lancer</div></div>
    </div>

    <div id="continueBox" class="continue" hidden>
      <div><b>Continue last map</b><div id="continueInfo" class="muted"></div></div>
      <button class="btn primary" id="btnContinue">Continue</button>
    </div>

    <h2>New map</h2>
    <label class="field"><span>Map name</span><input id="mName" value="New Battlefield"></label>
    <div class="row">
      <label class="field"><span>Columns (hexes wide)</span><input type="number" id="mCols" min="4" max="100" value="20"></label>
      <label class="field"><span>Rows (hexes tall)</span><input type="number" id="mRows" min="4" max="100" value="15"></label>
    </div>
    <div class="presets">
      <span class="muted">Presets:</span>
      <button class="btn small" data-c="12" data-r="10">Small 12×10</button>
      <button class="btn small" data-c="20" data-r="15">Medium 20×15</button>
      <button class="btn small" data-c="30" data-r="22">Large 30×22</button>
    </div>

    <label class="field"><span>Background image (optional)</span></label>
    <div class="bgpick">
      <button class="btn" id="btnPickBg">Choose image…</button>
      <span id="bgName">None</span>
      <button class="btn small" id="btnClearBg" hidden>✕</button>
    </div>
    <img id="bgPreview" hidden alt="">
    <div style="text-align:center;margin-top:8px">
      <button class="btn small" id="btnMatchRows" hidden>Match rows to image shape</button>
    </div>

    <div class="actions">
      <button class="btn" id="btnLoadFile">Open map file…</button>
      <a class="btn" href="Battlemap.html" style="text-decoration:none">Battlemap ▸</a>
      <button class="btn primary" id="btnCreate">Create map ▸</button>
    </div>
  </div>
</div>

<!-- ====================== EDITOR ====================== -->
<div id="editor">
  <header id="topbar">
    <span class="logo">⬡</span>
    <input id="eName" title="Map name">
    <div class="sep"></div>
    <button class="btn" id="btnUndo" title="Ctrl+Z">↶ Undo</button>
    <button class="btn" id="btnRedo" title="Ctrl+Y">↷ Redo</button>
    <button class="btn" id="btnFit" title="F">⤢ Fit view</button>
    <div class="grow"></div>
    <button class="btn" id="btnExport">Export PNG</button>
    <button class="btn" id="btnSaveFile" title="Ctrl+S">Save to file</button>
    <button class="btn" id="btnMenu">Main menu</button>
    <button class="btn primary" id="btnBackToBattle" hidden title="Return to the battlemap with this map; tokens stay where they were">Back to battle ▸</button>
  </header>

  <aside id="sidebar">
    <section>
      <h3>Paint</h3>
      <div class="tools">
        <button class="btn tool" data-tool="light"><span class="sw" style="background:#46b955"></span>Light cover<kbd>1</kbd></button>
        <button class="btn tool" data-tool="hard"><span class="sw" style="background:#3a3e45"></span>Hard cover<kbd>2</kbd></button>
        <button class="btn tool" data-tool="erase"><span class="sw erase"></span>Eraser<kbd>3</kbd></button>
        <button class="btn tool" data-tool="pan"><span style="width:16px;text-align:center">✋</span>Pan view<kbd>4</kbd></button>
      </div>
      <div class="tplcat">Zones</div>
      <div class="tools">
        <button class="btn tool" data-tool="deploy"><span class="sw zone" style="--zc:61,139,255"></span>Deployment zone<kbd>5</kbd></button>
        <button class="btn tool" data-tool="extract"><span class="sw zone" style="--zc:255,194,61"></span>Extraction zone<kbd>6</kbd></button>
      </div>
      <div class="tplcat">Effects</div>
      <div class="tools">
        <button class="btn tool" data-tool="difficult" title="Costs double movement to enter"><span class="sw diff"></span>Difficult terrain<kbd>7</kbd></button>
        <button class="btn tool" data-tool="climb" title="Click or drag along the border between two hexes. Crossing it costs double movement"><span class="climbic">╪</span>Climb (hex border)<kbd>8</kbd></button>
        <button class="btn tool" data-tool="dangerous" title="Entering it means an Engineering check or 5 damage; costs no extra movement"><span class="sw danger"></span>Dangerous terrain<kbd>9</kbd></button>
      </div>
      <div class="seg" id="brushSeg">
        <span>Brush</span>
        <button class="btn small" data-b="0">1 hex</button>
        <button class="btn small" data-b="1">7</button>
        <button class="btn small" data-b="2">19</button>
      </div>
    </section>

    <section>
      <h3>Templates</h3>
      <div id="tplList"></div>
      <div class="rotrow">
        <button class="btn small" id="rotL" title="Shift+R">⟲</button>
        <span id="rotLabel">0°</span>
        <button class="btn small" id="rotR" title="R">⟳</button>
        <kbd>R</kbd>
      </div>
      <label class="chk"><input type="checkbox" id="autoCover" checked> Templates also mark cover</label>
      <label class="chk"><input type="checkbox" id="autoClimb" checked> Buildings add climbs at their walls</label>
    </section>

    <section>
      <h3>Display</h3>
      <label class="chk"><input type="checkbox" id="showGrid" checked> Show grid lines</label>
      <label>Grid line opacity</label><input type="range" id="gridOp" min="0.05" max="1" step="0.05">
      <label>Background opacity</label><input type="range" id="bgOp" min="0" max="1" step="0.05">
      <div class="btnrow">
        <button class="btn small" id="btnBg">Background…</button>
        <button class="btn small" id="btnBgRemove">Remove bg</button>
      </div>
    </section>

    <section>
      <h3>Map</h3>
      <div class="row">
        <div><label>Columns</label><input type="number" id="eCols" min="4" max="100"></div>
        <div><label>Rows</label><input type="number" id="eRows" min="4" max="100"></div>
      </div>
      <div class="btnrow">
        <button class="btn small" id="btnResize">Apply size</button>
        <button class="btn small danger" id="btnClear">Clear all</button>
      </div>
    </section>
  </aside>

  <main id="stage"><canvas id="cv"></canvas><div id="toast"></div></main>

  <footer id="status">
    <span id="stHex">Hex —</span>
    <span id="stCounts"></span>
    <span class="grow"></span>
    <span>5/6: zones · 7–9: effects · Right-click: remove · Wheel: zoom · Space/middle-drag: pan · R: rotate · Esc: deselect</span>
    <span id="stSave"></span>
  </footer>
</div>

<input type="file" id="fileBg" accept="image/*" hidden>
<input type="file" id="fileMap" accept=".json,application/json" hidden>

<script src="hexmap_core.js"></script>
<script>
"use strict";
let S = null;            // the current map (everything here gets saved)
let bgImg = null;        // decoded background image
const view = { scale: 1, ox: 0, oy: 0 };
const ui = { tool:'light', brush:0, template:null, rot:0, autoCover:true, autoClimb:true, hover:null, hoverEdge:null,
             painting:false, paintMode:null, lastPaintKey:null, panning:false, last:null, space:false };
let undoStack = [], redoStack = [];

/* =========================================================================
   MAP RENDERING
   ========================================================================= */
function drawMap(ctx, opt) {
  drawMapLayers(ctx, opt.lw);

  if (!opt.live || !ui.hover || ui.panning) return;
  const h = ui.hover;
  if (ui.tool === 'template' && ui.template) {
    const cells = footprint(ui.template, h.q, h.r, ui.rot), ok = cells.every(c => inB(c.q, c.r));
    ctx.save(); ctx.globalAlpha = 0.7;
    TEMPLATES[ui.template].draw(ctx, cells, HEX, { id: S.nextId, rot: ui.rot, type: ui.template });
    ctx.restore();
    footprintPath(ctx, cells, HEX);
    ctx.fillStyle = ok ? 'rgba(79,209,255,0.12)' : 'rgba(255,60,60,0.4)'; ctx.fill();
    ctx.strokeStyle = ok ? '#4fd1ff' : '#ff4b4b'; ctx.lineWidth = opt.lw * 2; ctx.stroke();
  } else if (ui.tool === 'climb') {
    const E = ui.hoverEdge; if (!E) return;
    const [A, B] = edgeEnds(E.key), has = !!S.edges[E.key];
    ctx.save(); ctx.globalAlpha = has ? 1 : 0.6; drawClimb(ctx, A, B); ctx.restore();
    ctx.beginPath(); ctx.moveTo(A[0], A[1]); ctx.lineTo(B[0], B[1]);
    ctx.strokeStyle = has ? '#ff6b3d' : '#4fd1ff'; ctx.lineWidth = opt.lw * 3; ctx.stroke();
  } else if (ui.tool !== 'pan') {
    const p = new Path2D();
    brushCells(h, ui.brush).forEach(c => { if (inB(c.q, c.r)) { const x = axToPx(c.q, c.r); hexSub(p, x.x, x.y, HEX); } });
    const Z = ZONES[ui.tool];
    const col = Z ? `rgba(${Z.col},0.3)` : { light:'rgba(70,185,85,0.3)', hard:'rgba(30,33,38,0.45)', erase:'rgba(255,107,61,0.18)', difficult:'rgba(214,160,90,0.3)', dangerous:'rgba(236,84,60,0.3)' }[ui.tool];
    ctx.fillStyle = col; ctx.fill(p);
    ctx.strokeStyle = Z ? `rgb(${Z.col})` : ui.tool === 'erase' ? '#ff6b3d' : '#4fd1ff'; ctx.lineWidth = opt.lw * 2; ctx.stroke(p);
  }
}

const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let renderQueued = false;
function requestRender() { if (!renderQueued) { renderQueued = true; requestAnimationFrame(render); } }
function render() {
  renderQueued = false;
  const dpr = window.devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
  if (cv.width !== Math.round(w*dpr) || cv.height !== Math.round(h*dpr)) { cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr); }
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height);
  if (!S) return;
  ctx.setTransform(dpr*view.scale, 0, 0, dpr*view.scale, dpr*view.ox, dpr*view.oy);
  drawMap(ctx, { lw: 1.2 / view.scale, live: true });
}
function fitView() {
  const w = cv.clientWidth, h = cv.clientHeight;
  view.scale = Math.min((w - 40) / gridW(), (h - 40) / gridH());
  view.ox = (w - gridW()*view.scale) / 2; view.oy = (h - gridH()*view.scale) / 2;
  requestRender();
}

let saveTimer = null, dirty = false;
const $ = id => document.getElementById(id);
function setSaveStatus(t, cls) { const el = $('stSave'); el.textContent = t; el.className = cls || ''; }
function scheduleSave() { dirty = true; setSaveStatus('Unsaved changes…'); clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 600); }
async function saveNow() {
  clearTimeout(saveTimer); if (!S) return;
  try { await store.put('autosave', S); dirty = false; setSaveStatus('Autosaved ✓', 'ok'); }
  catch (e) { console.error(e); setSaveStatus('Autosave failed (background image too big?) – use "Save to file"', 'bad'); }
}
window.addEventListener('beforeunload', () => { if (S && dirty) saveNow(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && S && dirty) saveNow(); });

/* =========================================================================
   EDITING ACTIONS
   ========================================================================= */
const snap = () => JSON.stringify({ cells: S.cells, zones: S.zones, effects: S.effects, edges: S.edges, objects: S.objects, nextId: S.nextId });
function pushUndo() { undoStack.push(snap()); if (undoStack.length > 200) undoStack.shift(); redoStack = []; updateUndoBtns(); }
function restoreSnap(j) { const d = JSON.parse(j); S.cells = d.cells; S.zones = d.zones || {}; S.effects = d.effects || {}; S.edges = d.edges || {}; S.objects = d.objects; S.nextId = d.nextId; changed(); }
function undo() { if (!undoStack.length) return; redoStack.push(snap()); restoreSnap(undoStack.pop()); updateUndoBtns(); }
function redo() { if (!redoStack.length) return; undoStack.push(snap()); restoreSnap(redoStack.pop()); updateUndoBtns(); }
function updateUndoBtns() { $('btnUndo').disabled = !undoStack.length; $('btnRedo').disabled = !redoStack.length; }

function changed() { requestRender(); scheduleSave(); updateCounts(); }
function updateCounts() {
  let l = 0, h = 0; for (const k in S.cells) S.cells[k] === 'light' ? l++ : h++;
  let dz = 0, ez = 0; for (const k in S.zones) S.zones[k] === 'deploy' ? dz++ : ez++;
  $('stCounts').textContent = `Light cover: ${l} · Hard cover: ${h} · Deploy: ${dz} · Extract: ${ez} · Difficult: ${Object.values(S.effects).filter(v => v === 'difficult').length} · Dangerous: ${Object.values(S.effects).filter(v => v === 'dangerous').length} · Climbs: ${Object.keys(S.edges).length} · Templates: ${S.objects.length}`;
}
function paintAt(h) {
  const k = h.q + ',' + h.r; if (k === ui.lastPaintKey) return; ui.lastPaintKey = k;
  brushCells(h, ui.brush).forEach(c => {
    if (!inB(c.q, c.r)) return; const key = keyOf(c.q, c.r);
    if (ui.paintMode === 'erase') {
      delete S.cells[key]; delete S.zones[key]; delete S.effects[key];
      DIRS.forEach(([dq, dr]) => delete S.edges[edgeKey(c, { q: c.q + dq, r: c.r + dr })]);
    }
    else if (ui.paintMode === 'difficult' || ui.paintMode === 'dangerous') S.effects[key] = ui.paintMode;
    else if (ZONES[ui.paintMode]) S.zones[key] = ui.paintMode;
    else S.cells[key] = ui.paintMode;
  });
  changed();
}
// Climb borders: only borders between two hexes on the map count
function edgeAt(e, maxDist) {
  const w = worldAt(e), E = edgeNear(w.x, w.y);
  return inB(E.a.q, E.a.r) && inB(E.b.q, E.b.r) && (maxDist == null || E.dist <= maxDist) ? E : null;
}
function paintEdge(E) {
  if (!E || E.key === ui.lastPaintKey) return; ui.lastPaintKey = E.key;
  if (ui.paintMode === 'add') S.edges[E.key] = 'climb'; else delete S.edges[E.key];
  changed();
}
function objectAt(h) {
  for (let i = S.objects.length - 1; i >= 0; i--) {
    const o = S.objects[i];
    if (footprint(o.type, o.q, o.r, o.rot).some(c => c.q === h.q && c.r === h.r)) return i;
  }
  return -1;
}
function removeObject(i) {
  const o = S.objects[i];
  if (o.cover) footprint(o.type, o.q, o.r, o.rot).forEach(c => { const k = keyOf(c.q, c.r); if (S.cells[k] === o.cover) delete S.cells[k]; });
  S.objects.splice(i, 1);
  // take away this building's wall climbs, except where another building still has a wall
  if (o.climbs && o.climbs.length) {
    const kept = new Set(S.objects.flatMap(x => x.climbs || []));
    o.climbs.forEach(k => { if (!kept.has(k)) delete S.edges[k]; });
  }
}
function placeTemplate(h) {
  const T = TEMPLATES[ui.template], cells = footprint(ui.template, h.q, h.r, ui.rot);
  if (!cells.every(c => inB(c.q, c.r))) { toast("That template doesn't fit there"); return; }
  pushUndo();
  const o = { id: S.nextId++, type: ui.template, q: h.q, r: h.r, rot: ui.rot, cover: null };
  if (ui.autoCover && T.cover) { o.cover = T.cover; cells.forEach(c => S.cells[keyOf(c.q, c.r)] = T.cover); }
  // a building records its wall climbs, including ones shared with another building's wall, but never
  // hand-drawn ones, so removing it leaves those alone
  if (ui.autoClimb && T.roof) {
    const owned = new Set(S.objects.flatMap(x => x.climbs || []));
    o.climbs = outlineEdges(cells).filter(k => !S.edges[k] || owned.has(k));
    o.climbs.forEach(k => S.edges[k] = 'climb');
  }
  S.objects.push(o); changed();
}
function setTool(t) {
  ui.tool = t; if (t !== 'template') ui.template = null;
  document.querySelectorAll('.tool').forEach(b => b.classList.toggle('active', b.dataset.tool === t));
  document.querySelectorAll('.tpl').forEach(b => b.classList.toggle('active', b.dataset.tpl === ui.template));
  updateCursor(); updateRotLabel(); requestRender();
}
function selectTemplate(type) {
  if (ui.template === type) { setTool('light'); return; }
  ui.template = type; setTool('template');
}
function rotate(d) { ui.rot = ((ui.rot + d) % 6 + 6) % 6; updateRotLabel(); requestRender(); }
function updateRotLabel() { const st = ui.template ? TEMPLATES[ui.template].rotStep : 60; $('rotLabel').textContent = (ui.rot * st) + '°'; }
function setBrush(b) { ui.brush = b; document.querySelectorAll('#brushSeg button').forEach(x => x.classList.toggle('active', +x.dataset.b === b)); requestRender(); }
function updateCursor() { cv.style.cursor = ui.panning ? 'grabbing' : (ui.space || ui.tool === 'pan') ? 'grab' : 'crosshair'; }
let toastT = null;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 1800); }

/* =========================================================================
   CANVAS INPUT
   ========================================================================= */
function worldAt(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left - view.ox) / view.scale, y: (e.clientY - r.top - view.oy) / view.scale }; }
function hexAt(e) { const w = worldAt(e), h = pxToAx(w.x, w.y); return inB(h.q, h.r) ? h : null; }

cv.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('mousedown', e => { if (e.button === 1) e.preventDefault(); });
cv.addEventListener('pointerdown', e => {
  if (!S) return;
  cv.setPointerCapture(e.pointerId);
  if (e.button === 1 || (e.button === 0 && (ui.space || ui.tool === 'pan'))) {
    ui.panning = true; ui.last = { x: e.clientX, y: e.clientY }; updateCursor(); requestRender(); return;
  }
  if (ui.tool === 'climb' && (e.button === 0 || e.button === 2)) {
    const E = edgeAt(e); if (!E) return;
    // the first border decides whether this drag adds climbs or removes them; right-drag always removes
    pushUndo(); ui.painting = true; ui.paintMode = e.button === 2 || S.edges[E.key] ? 'remove' : 'add';
    ui.lastPaintKey = null; paintEdge(E); return;
  }
  const h = hexAt(e); if (!h) return;
  if (e.button === 2) {
    const i = objectAt(h);
    if (i >= 0) { pushUndo(); removeObject(i); changed(); return; }
    pushUndo(); ui.painting = true; ui.paintMode = 'erase'; ui.lastPaintKey = null; paintAt(h); return;
  }
  if (e.button !== 0) return;
  if (ui.tool === 'template') { placeTemplate(h); return; }
  pushUndo(); ui.painting = true; ui.paintMode = ui.tool; ui.lastPaintKey = null; paintAt(h);
});
cv.addEventListener('pointermove', e => {
  if (!S) return;
  if (ui.panning) { view.ox += e.clientX - ui.last.x; view.oy += e.clientY - ui.last.y; ui.last = { x: e.clientX, y: e.clientY }; requestRender(); return; }
  const h = hexAt(e);
  const prev = ui.hover; ui.hover = h;
  if (h) { const o = axToOff(h.q, h.r); $('stHex').textContent = `Hex ${o.c + 1}, ${o.r + 1}`; } else $('stHex').textContent = 'Hex —';
  if (ui.tool === 'climb') {
    const E = edgeAt(e), pk = ui.hoverEdge && ui.hoverEdge.key; ui.hoverEdge = E;
    if (ui.painting) paintEdge(edgeAt(e, HEX*0.45));
    if ((E && E.key) !== pk) requestRender();
    return;
  }
  if (ui.painting && h) paintAt(h);
  if (!prev || !h || prev.q !== h.q || prev.r !== h.r) requestRender();
});
function endPointer() { ui.painting = false; ui.panning = false; updateCursor(); requestRender(); }
cv.addEventListener('pointerup', endPointer);
cv.addEventListener('pointercancel', endPointer);
cv.addEventListener('pointerleave', () => { if (!ui.painting && !ui.panning) { ui.hover = null; requestRender(); } });
cv.addEventListener('wheel', e => {
  if (!S) return; e.preventDefault();
  const r = cv.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
  const ns = Math.min(8, Math.max(0.05, view.scale * Math.exp(-e.deltaY * 0.0015)));
  view.ox = mx - (mx - view.ox) * ns / view.scale; view.oy = my - (my - view.oy) * ns / view.scale; view.scale = ns;
  requestRender();
}, { passive: false });
window.addEventListener('resize', requestRender);

const typing = e => ['INPUT', 'TEXTAREA'].includes(e.target.tagName) && e.target.type !== 'checkbox' && e.target.type !== 'range';
window.addEventListener('keydown', e => {
  if (!S || $('editor').style.display !== 'grid' || typing(e)) return;
  const k = e.key.toLowerCase();
  if (e.ctrlKey || e.metaKey) {
    if (k === 'z' && !e.shiftKey) { e.preventDefault(); undo(); }
    else if (k === 'y' || (k === 'z' && e.shiftKey)) { e.preventDefault(); redo(); }
    else if (k === 's') { e.preventDefault(); saveToFile(); }
    return;
  }
  if (k === ' ') { e.preventDefault(); if (!ui.space) { ui.space = true; updateCursor(); } return; }
  if (k === '1') setTool('light'); else if (k === '2') setTool('hard'); else if (k === '3') setTool('erase'); else if (k === '4') setTool('pan');
  else if (k === '5') setTool('deploy'); else if (k === '6') setTool('extract');
  else if (k === '7') setTool('difficult'); else if (k === '8') setTool('climb'); else if (k === '9') setTool('dangerous');
  else if (k === 'r') rotate(e.shiftKey ? -1 : 1);
  else if (k === 'f') fitView();
  else if (k === 'escape') setTool('light');
});
window.addEventListener('keyup', e => { if (e.key === ' ') { if (!typing(e)) e.preventDefault(); ui.space = false; updateCursor(); } });

/* =========================================================================
   FILES: images, export, save/load
   ========================================================================= */
function loadBgImage() {
  bgImg = null; if (!S.bg) { requestRender(); return; }
  const img = new Image(); img.onload = () => { bgImg = img; requestRender(); }; img.src = S.bg;
}
function download(blob, name) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
const safeName = () => (S.name || 'map').replace(/[^\w\- ]+/g, '').trim() || 'map';
function exportPNG() {
  const k = Math.min(2, 8000 / Math.max(gridW(), gridH()));
  const c = document.createElement('canvas'); c.width = Math.ceil(gridW()*k); c.height = Math.ceil(gridH()*k);
  const x = c.getContext('2d'); x.scale(k, k); drawMap(x, { lw: 1.5, live: false });
  c.toBlob(b => { download(b, safeName() + '.png'); toast('PNG exported'); });
}
function saveToFile() { download(new Blob([JSON.stringify(S)], { type: 'application/json' }), safeName() + '.hexmap.json'); toast('Map file saved'); }

/* =========================================================================
   MENU
   ========================================================================= */
let pendingBg = null, bgTarget = 'menu', savedMap = null;
const clampInt = (v, lo, hi, def) => { v = parseInt(v, 10); return isNaN(v) ? def : Math.min(hi, Math.max(lo, v)); };

function showMenu() {
  $('editor').style.display = 'none'; $('menu').style.display = 'flex';
  store.get('autosave').then(m => {
    savedMap = m;
    $('continueBox').hidden = !m;
    if (m) $('continueInfo').textContent = `"${m.name}" · ${m.cols}×${m.rows} hexes · ${m.objects.length} templates`;
  }).catch(() => { $('continueBox').hidden = true; });
}
function startEditor(map) {
  S = map; undoStack = []; redoStack = []; updateUndoBtns();
  $('menu').style.display = 'none'; $('editor').style.display = 'grid';
  $('eName').value = S.name; $('eCols').value = S.cols; $('eRows').value = S.rows;
  $('showGrid').checked = S.showGrid; $('gridOp').value = S.gridOpacity; $('bgOp').value = S.bgOpacity;
  loadBgImage(); updateCounts(); setTool('light'); setBrush(ui.brush);
  requestAnimationFrame(() => { fitView(); });
  saveNow();
}
function setPendingBg(r, name) {
  pendingBg = r;
  $('bgName').textContent = r ? name : 'None';
  $('btnClearBg').hidden = $('btnMatchRows').hidden = $('bgPreview').hidden = !r;
  if (r) $('bgPreview').src = r.url;
}

document.querySelectorAll('.presets button').forEach(b => b.onclick = () => { $('mCols').value = b.dataset.c; $('mRows').value = b.dataset.r; });
$('btnPickBg').onclick = () => { bgTarget = 'menu'; $('fileBg').click(); };
$('btnClearBg').onclick = () => setPendingBg(null);
$('btnMatchRows').onclick = () => {
  if (!pendingBg) return;
  const cols = clampInt($('mCols').value, 4, 100, 20);
  $('mRows').value = clampInt(Math.round(((pendingBg.h / pendingBg.w) * SQRT3 * (cols + 0.5) - 0.5) / 1.5), 4, 100, 15);
};
$('btnCreate').onclick = () => {
  if (savedMap && !confirm(`Creating a new map replaces your autosaved map "${savedMap.name}".\n\nTip: use "Save to file" first if you want to keep it.\n\nContinue?`)) return;
  startEditor({
    version: 1, name: $('mName').value.trim() || 'New Battlefield',
    cols: clampInt($('mCols').value, 4, 100, 20), rows: clampInt($('mRows').value, 4, 100, 15),
    bg: pendingBg ? pendingBg.url : null, bgOpacity: 1, showGrid: true, gridOpacity: 0.45,
    cells: {}, zones: {}, effects: {}, edges: {}, objects: [], nextId: 1,
  });
};
$('btnContinue').onclick = () => { if (savedMap) startEditor(normalizeMap(savedMap)); };
$('btnLoadFile').onclick = () => $('fileMap').click();
$('fileMap').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const map = normalizeMap(JSON.parse(await f.text()));
    if (savedMap && !confirm(`Opening this file replaces your autosaved map "${savedMap.name}". Continue?`)) return;
    startEditor(map);
  } catch (err) { alert('Could not open map: ' + err.message); }
};
$('fileBg').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const r = await readImageFile(f);
    if (bgTarget === 'menu') setPendingBg(r, f.name);
    else { S.bg = r.url; loadBgImage(); scheduleSave(); toast('Background updated'); }
  } catch (err) { alert(err.message); }
};

/* =========================================================================
   EDITOR UI WIRING
   ========================================================================= */
(function buildTemplateList() {
  const list = $('tplList'), cats = {};
  for (const [id, T] of Object.entries(TEMPLATES)) (cats[T.cat] = cats[T.cat] || []).push(id);
  for (const [cat, ids] of Object.entries(cats)) {
    const h = document.createElement('div'); h.className = 'tplcat'; h.textContent = cat; list.appendChild(h);
    const grid = document.createElement('div'); grid.className = 'tplgrid'; list.appendChild(grid);
    ids.forEach(id => {
      const T = TEMPLATES[id], b = document.createElement('button');
      b.className = 'btn tpl'; b.dataset.tpl = id;
      b.title = `${T.name} — ${T.fp.length} hex${T.fp.length > 1 ? 'es' : ''}` + (T.cover ? `, ${COVER[T.cover].label.toLowerCase()}` : '');
      const c = document.createElement('canvas'); c.width = 124; c.height = 108;
      b.appendChild(c); b.appendChild(document.createTextNode(T.name));
      b.onclick = () => selectTemplate(id);
      grid.appendChild(b); drawPreview(c, id);
    });
  }
})();
function drawPreview(canvas, type) {
  const x = canvas.getContext('2d'), T = TEMPLATES[type], s = HEX;
  const cells = T.fp.map(([q, r]) => ({ q, r, x: s*SQRT3*(q + r/2), y: s*1.5*r }));
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  cells.forEach(c => { x0 = Math.min(x0, c.x - s*0.88); x1 = Math.max(x1, c.x + s*0.88); y0 = Math.min(y0, c.y - s); y1 = Math.max(y1, c.y + s); });
  const pad = 8, k = Math.min((canvas.width - pad*2) / (x1 - x0), (canvas.height - pad*2) / (y1 - y0));
  x.setTransform(k, 0, 0, k, canvas.width/2 - (x0 + x1)/2*k, canvas.height/2 - (y0 + y1)/2*k);
  x.beginPath(); cells.forEach(c => hexSub(x, c.x, c.y, s)); x.fillStyle = '#212834'; x.fill();
  x.strokeStyle = 'rgba(200,220,245,0.25)'; x.lineWidth = 2/k; x.stroke();
  x.save(); T.draw(x, cells, s, { id: 3, rot: 0, type }); x.restore();
}

document.querySelectorAll('.tool').forEach(b => b.onclick = () => setTool(b.dataset.tool));
document.querySelectorAll('#brushSeg button').forEach(b => b.onclick = () => setBrush(+b.dataset.b));
$('rotL').onclick = () => rotate(-1);
$('rotR').onclick = () => rotate(1);
$('autoCover').onchange = e => { ui.autoCover = e.target.checked; };
$('autoClimb').onchange = e => { ui.autoClimb = e.target.checked; };
$('showGrid').onchange = e => { S.showGrid = e.target.checked; requestRender(); scheduleSave(); };
$('gridOp').oninput = e => { S.gridOpacity = +e.target.value; requestRender(); scheduleSave(); };
$('bgOp').oninput = e => { S.bgOpacity = +e.target.value; requestRender(); scheduleSave(); };
$('btnBg').onclick = () => { bgTarget = 'editor'; $('fileBg').click(); };
$('btnBgRemove').onclick = () => { if (S.bg && confirm('Remove the background image?')) { S.bg = null; loadBgImage(); scheduleSave(); } };
$('eName').oninput = e => { S.name = e.target.value; scheduleSave(); };
$('btnUndo').onclick = undo;
$('btnRedo').onclick = redo;
$('btnFit').onclick = fitView;
$('btnExport').onclick = exportPNG;
$('btnSaveFile').onclick = saveToFile;
$('btnMenu').onclick = async () => { await saveNow(); S = null; bgImg = null; $('btnBackToBattle').hidden = true; showMenu(); };
$('btnBackToBattle').onclick = async () => { await saveNow(); location.href = 'Battlemap.html?from=editor'; };
$('btnClear').onclick = () => {
  if (!confirm('Remove all cover, zones, effects and templates from this map? (You can undo this.)')) return;
  pushUndo(); S.cells = {}; S.zones = {}; S.effects = {}; S.edges = {}; S.objects = []; changed();
};
$('btnResize').onclick = () => {
  const c = clampInt($('eCols').value, 4, 100, S.cols), r = clampInt($('eRows').value, 4, 100, S.rows);
  $('eCols').value = c; $('eRows').value = r;
  if (c === S.cols && r === S.rows) return;
  const old = { cols: S.cols, rows: S.rows }; S.cols = c; S.rows = r;
  const inside = k => { const [cc, rr2] = k.split(',').map(Number); return cc < c && rr2 < r; };
  const keepCells = Object.keys(S.cells).filter(inside), keepZones = Object.keys(S.zones).filter(inside);
  const keepFx = Object.keys(S.effects).filter(inside), keepEdges = Object.keys(S.edges).filter(k => k.split('|').every(inside));
  const keepObjs = S.objects.filter(o => footprint(o.type, o.q, o.r, o.rot).every(x => inB(x.q, x.r)));
  const lost = Object.keys(S.cells).length - keepCells.length + Object.keys(S.zones).length - keepZones.length
    + Object.keys(S.effects).length - keepFx.length + Object.keys(S.edges).length - keepEdges.length + S.objects.length - keepObjs.length;
  if (lost && !confirm(`Shrinking the map will remove ${lost} painted hex(es)/template(s) outside the new edge. Continue?`)) { Object.assign(S, old); return; }
  const cells = {}; keepCells.forEach(k => cells[k] = S.cells[k]);
  const zones = {}; keepZones.forEach(k => zones[k] = S.zones[k]);
  const effects = {}; keepFx.forEach(k => effects[k] = S.effects[k]);
  const edges = {}; keepEdges.forEach(k => edges[k] = S.edges[k]);
  S.cells = cells; S.zones = zones; S.effects = effects; S.edges = edges; S.objects = keepObjs; undoStack = []; redoStack = []; updateUndoBtns();
  fitView(); changed();
};

/* =========================================================================
   BOOT
   ========================================================================= */
// Opened from the battlemap's "Edit map": go straight to its map, with a way back
const fromBattle = new URLSearchParams(location.search).get('from') === 'battle';
history.replaceState(null, '', location.pathname);
store.init().then(async () => {
  const m = fromBattle && await store.get('autosave').catch(() => null);
  if (!m) { showMenu(); return; }
  startEditor(normalizeMap(m)); $('btnBackToBattle').hidden = false;
});
</script>
